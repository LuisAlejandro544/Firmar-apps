name: "Compilar APK Debug por Arquitectura (Sin Caché)"

# ==============================================================================
# Pipeline de CI/CD para Compilación de APKs Debug en GitHub Actions
# ==============================================================================
# Este flujo descarga el proyecto, genera una firma criptográfica única desde
# cero mediante el script generate-debug-keystore.sh (sin depender de firmas previas
# ni secrets), compila en modo Debug de forma limpia (sin caché de compilación ni
# daemons persistentes) y empaqueta las arquitecturas de forma independiente en
# artifacts separados para su descarga directa en dispositivos móviles.
# ==============================================================================

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    # Permite disparar la compilación manualmente desde la interfaz web de GitHub

jobs:
  build-debug-apks:
    name: "Compilar APKs Debug (Firma en Vivo y Sin Caché)"
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el código fuente completo del repositorio
      - name: "📥 Descargar código fuente del proyecto"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Paso 2: Configurar Java JDK 17 (Estrictamente SIN caché para evitar residuos)
      - name: "☕ Configurar Java JDK 17 (Sin caché)"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          # Nota: No se define 'cache: gradle' intencionalmente para garantizar un entorno limpio

      # Paso 3: Configurar Gradle oficial con la última versión (9.3.1) y caché desactivada
      - name: "🐘 Configurar Gradle Wrapper v9.3.1 (Caché estrictamente deshabilitada)"
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-disabled: true

      # Paso 4: Obligar la generación de firma criptográfica desde cero con el script .sh
      - name: "🔐 Generar firma Keystore desde cero (Forzado)"
        run: |
          chmod +x ./scripts/generate-debug-keystore.sh
          ./scripts/generate-debug-keystore.sh

      # Paso 5: Compilar APK Debug con Gradle Wrapper oficial (Sin caché de compilación)
      - name: "🔨 Compilar APK Debug con Gradle Wrapper"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace

      # Paso 6: Verificar que los APKs Debug por arquitectura se hayan generado exitosamente
      - name: "🔍 Verificar existencia de los APKs Debug compilados"
        run: |
          APK_DIR="app/build/outputs/apk/debug"
          for ABI in "arm64-v8a" "armeabi-v7a" "x86_64"; do
            if [ ! -f "$APK_DIR/app-$ABI-debug.apk" ]; then
              echo "❌ ERROR: No se encontró el binario para $ABI en $APK_DIR/app-$ABI-debug.apk"
              exit 1
            fi
            echo "✅ APK Debug $ABI encontrado. Tamaño: $(wc -c < "$APK_DIR/app-$ABI-debug.apk") bytes"
          done
          if [ ! -f "$APK_DIR/app-universal-debug.apk" ]; then
            echo "❌ ERROR: No se encontró el binario Universal en $APK_DIR/app-universal-debug.apk"
            exit 1
          fi
          echo "✅ APK Debug Universal encontrado. Tamaño: $(wc -c < "$APK_DIR/app-universal-debug.apk") bytes"

      # Paso 7: Desglosar, purgar y aislar estrictamente los APKs por arquitectura
      # Ejecuta el script isolate-and-sign-abi-apk.py para garantizar que cada binario individual
      # contenga única y exclusivamente las librerías nativas (.so) de su propia arquitectura,
      # eliminando quirúrgicamente cualquier librería ajena empaquetada por error, re-alineando
      # a 4 bytes con zipalign y aplicando una firma fresca con apksigner y debug.keystore.
      - name: "📦 Aislar librerías nativas y firmar APKs por arquitectura"
        run: |
          chmod +x ./scripts/isolate-and-sign-abi-apk.py
          APK_DIR="app/build/outputs/apk/debug"

          # 1. Procesar ARM 64-bit (arm64-v8a)
          python3 ./scripts/isolate-and-sign-abi-apk.py \
            --input "$APK_DIR/app-arm64-v8a-debug.apk" \
            --abi "arm64-v8a" \
            --output "dist/arm64-v8a/KeystoreCreator-debug-arm64-v8a.apk" \
            --keystore "debug.keystore"

          # 2. Procesar ARM 32-bit (armeabi-v7a)
          python3 ./scripts/isolate-and-sign-abi-apk.py \
            --input "$APK_DIR/app-armeabi-v7a-debug.apk" \
            --abi "armeabi-v7a" \
            --output "dist/armeabi-v7a/KeystoreCreator-debug-armeabi-v7a.apk" \
            --keystore "debug.keystore"

          # 3. Procesar x86_64 (Emuladores y PCs)
          python3 ./scripts/isolate-and-sign-abi-apk.py \
            --input "$APK_DIR/app-x86_64-debug.apk" \
            --abi "x86_64" \
            --output "dist/x86_64/KeystoreCreator-debug-x86_64.apk" \
            --keystore "debug.keystore"

          # 4. Procesar Universal (Todas las ABIs combinadas)
          python3 ./scripts/isolate-and-sign-abi-apk.py \
            --input "$APK_DIR/app-universal-debug.apk" \
            --abi "universal" \
            --output "dist/universal/KeystoreCreator-debug-universal.apk" \
            --keystore "debug.keystore"

          echo "======================================================================"
          echo "🛡️  AUDITORÍA FINAL ESTRICTA DE SEGURIDAD Y AISLAMIENTO DE ARQUITECTURAS"
          echo "======================================================================"

          echo "--- Verificando ARM 64-bit (KeystoreCreator-debug-arm64-v8a.apk) ---"
          unzip -l dist/arm64-v8a/KeystoreCreator-debug-arm64-v8a.apk | grep "lib/" || true
          if unzip -l dist/arm64-v8a/KeystoreCreator-debug-arm64-v8a.apk | grep "lib/" | grep -v "lib/arm64-v8a/"; then
            echo "❌ FALLO CRÍTICO: Se encontraron librerías ajenas dentro del APK arm64-v8a!"
            exit 1
          fi

          echo "--- Verificando ARM 32-bit (KeystoreCreator-debug-armeabi-v7a.apk) ---"
          unzip -l dist/armeabi-v7a/KeystoreCreator-debug-armeabi-v7a.apk | grep "lib/" || true
          if unzip -l dist/armeabi-v7a/KeystoreCreator-debug-armeabi-v7a.apk | grep "lib/" | grep -v "lib/armeabi-v7a/"; then
            echo "❌ FALLO CRÍTICO: Se encontraron librerías ajenas dentro del APK armeabi-v7a!"
            exit 1
          fi

          echo "--- Verificando x86_64 (KeystoreCreator-debug-x86_64.apk) ---"
          unzip -l dist/x86_64/KeystoreCreator-debug-x86_64.apk | grep "lib/" || true
          if unzip -l dist/x86_64/KeystoreCreator-debug-x86_64.apk | grep "lib/" | grep -v "lib/x86_64/"; then
            echo "❌ FALLO CRÍTICO: Se encontraron librerías ajenas dentro del APK x86_64!"
            exit 1
          fi

          echo "--- Verificando Universal (KeystoreCreator-debug-universal.apk) ---"
          unzip -l dist/universal/KeystoreCreator-debug-universal.apk | grep "lib/" || true

          echo "======================================================================"
          echo "✅ TODOS LOS APKS HAN SIDO VERIFICADOS Y AISLADOS EXITOSAMENTE."
          echo "Listado de paquetes listos para distribución:"
          ls -lh dist/*/*.apk
          echo "======================================================================"

      # Paso 8.1: Subir Artifact individual para ARM 64-bit (arm64-v8a)
      - name: "🚀 Subir Artifact individual - ARM 64-bit (arm64-v8a)"
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-arm64-v8a
          path: dist/arm64-v8a/KeystoreCreator-debug-arm64-v8a.apk
          retention-days: 14
          if-no-files-found: error

      # Paso 8.2: Subir Artifact individual para ARM 32-bit (armeabi-v7a)
      - name: "🚀 Subir Artifact individual - ARM 32-bit (armeabi-v7a)"
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-armeabi-v7a
          path: dist/armeabi-v7a/KeystoreCreator-debug-armeabi-v7a.apk
          retention-days: 14
          if-no-files-found: error

      # Paso 8.3: Subir Artifact individual para x86_64 (Emuladores y PCs)
      - name: "🚀 Subir Artifact individual - x86_64"
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-x86_64
          path: dist/x86_64/KeystoreCreator-debug-x86_64.apk
          retention-days: 14
          if-no-files-found: error

      # Paso 8.4: Subir Artifact individual: Universal (Todas las ABIs)
      - name: "🚀 Subir Artifact individual - Universal"
        uses: actions/upload-artifact@v4
        with:
          name: APK-Debug-Universal
          path: dist/universal/KeystoreCreator-debug-universal.apk
          retention-days: 14
          if-no-files-found: error
